[package]
name = "ozx"
version = "0.1.0"
authors = ["Chris Barnes <chrislloydbarnes@gmail.com>"]
rust-version = "1.91"
edition = "2024"
description = "A CLI for creating OZX archives from OME-Zarr data."
repository = "https://github.com/clbarnes/ozx"
license = "MIT"
keywords= ["ome", "zarr", "ozx", "cli", "bioimaging"]
categories = ["command-line-utilities", "science::bioinformatics", "multimedia::images", "encoding"]

[dependencies]
anyhow = "1.0.100"
bytes = "1.12.1"
clap = { version = "4.5.60", features = ["derive"] }
clap-verbosity-flag = {version="3.0.4",default-features = false, features = ["tracing"]}
clio = { version = "0.3.5", features = ["clap-parse"] }
futures = "0.3.34"
indicatif = "0.18.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
storecfg = { git = "https://github.com/clbarnes/storecfg.git", version = "0.1.0" , features = ["clap"]}
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"
zip = { version = "9.3.0", default-features = false }

[dependencies.opendal]
version = "0.59.5"
default-features = false
features = ["auto-register-services", "executors-tokio", "layers-tracing", "layers-concurrent-limit", "layers-retry", "layers-timeout", "services-fs", "services-s3", "http-transport-reqwest"]
